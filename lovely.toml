[manifest]
version = "1.0.0"
priority = 0

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "return self.base.suit == suit"
position = "at"
payload = '''
if self.base.suit ~= "bra_suitless" or (G.GAME.bra_suitless_mode and G.GAME.bra_suitless_mode == "Suit") then return self.base.suit == suit
else
    if G.GAME.bra_suitless_mode and G.GAME.bra_suitless_mode == "Wild" then return true end
    return false
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "G.FUNCS.evaluate_play()"
position = "at"
payload = '''
if G.GAME.blind.name == "bl_bra_roshambo" then G.GAME.blind:roshambo()
else G.FUNCS.evaluate_play() end
'''
match_indent = true


[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "add_round_eval_row({name = 'bottom', dollars = dollars})"
position = "before"
payload = '''
for i = 1, #G.jokers.cards do
    local ret = G.jokers.cards[i]:calculate_joker({bra_dollar_mult = true})
    if ret then
        add_round_eval_row({dollar_mult = ret.dollar_mult, bonus = true, name='bra_joker_mult'..i, pitch = pitch, card = G.jokers.cards[i]})
        pitch = pitch + 0.06
        dollars = dollars * ret.dollar_mult
    end
end
dollars = math.floor(dollars)
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if num_dollars > 60 or num_dollars < -60 then"
position = "at"
payload = '''
if config.dollar_mult then
    local dollar_string = "X"..config.dollar_mult
    G.E_MANAGER:add_event(Event({
        trigger = 'before',delay = 0.38,
        func = function()
            G.round_eval:add_child(
                    {n=G.UIT.R, config={align = "cm", id = 'dollar_row_'..(dollar_row+1)..'_'..config.name}, nodes={
                        {n=G.UIT.O, config={object = DynaText({string = {dollar_string}, colours = {G.C.MONEY}, shadow = true, pop_in = 0, scale = 0.65, float = true})}}
                    }},
                    G.round_eval:get_UIE_by_ID('dollar_'..config.name))

            play_sound('coin3', 0.9+0.2*math.random(), 0.7)
            play_sound('coin6', 1.3, 0.8)
            return true
        end
    }))
elseif num_dollars > 60 or num_dollars < -60 then
'''
match_indent = true
